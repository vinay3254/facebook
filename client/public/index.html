<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F7F2E8" />
    <meta name="description" content="Reunion - Connect with friends and the world around you" />
    <title>Reunion</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--dark-text);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      :root {
        --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", "Segoe UI", sans-serif;
        --font-mono: ui-monospace, "SFMono-Regular", Menlo, Monaco, monospace;
        --primary: #105666;
        --primary-dark: #0A3323;
        --primary-shadow: #0A3323;
        --primary-light: rgba(16, 86, 102, 0.12);
        --primary-glow: rgba(16, 86, 102, 0.2);
        --accent-pop: #D3968C;
        --accent-moss: #839958;
        --bg: #F7F4D5;
        --bg2: #FBF9E4;
        --white: rgba(255, 253, 240, 0.92);
        --dark-text: #0A3323;
        --secondary-text: #526B42;
        --border: rgba(10, 51, 35, 0.16);
        --border-light: rgba(10, 51, 35, 0.09);
        --hover-bg: rgba(131, 153, 88, 0.15);
        --card-bg: rgba(255, 253, 240, 0.9);
        --shadow-sm: 0 8px 18px -14px rgba(10, 51, 35, 0.14);
        --shadow: 0 16px 34px -26px rgba(10, 51, 35, 0.18);
        --shadow-md: 0 20px 40px -28px rgba(10, 51, 35, 0.22);
        --shadow-lg: 0 26px 52px -30px rgba(10, 51, 35, 0.24);
        --shadow-xl: 0 32px 64px -34px rgba(10, 51, 35, 0.28);
        --surface: rgba(255, 253, 240, 0.88);
        --surface-strong: rgba(255, 254, 245, 0.95);
        --surface-subtle: rgba(255, 255, 255, 0.6);
        --field-bg: rgba(10, 51, 35, 0.05);
        --field-placeholder: rgba(10, 51, 35, 0.5);
        --panel-shadow: 0 24px 60px -40px rgba(10, 51, 35, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.7);
        --shell-bg:
          radial-gradient(circle at top left, rgba(131, 153, 88, 0.2), transparent 32%),
          radial-gradient(circle at bottom right, rgba(16, 86, 102, 0.15), transparent 38%),
          #F7F4D5;
        --page-glow:
          linear-gradient(180deg, rgba(255, 255, 255, 0.6) 0%, transparent 20%),
          radial-gradient(circle at 50% 0%, rgba(211, 150, 140, 0.15), transparent 40%);
        --auth-bg:
          radial-gradient(circle at top, rgba(131, 153, 88, 0.25), transparent 35%),
          linear-gradient(180deg, #FBF9E4 0%, #F5F1CB 100%);
        --story-overlay: rgba(10, 51, 35, 0.88);
        --item-bg: rgba(10, 51, 35, 0.04);
        --feed-heading: #0A3323;
        --feed-text: #48613A;
        --radius-sm: 10px;
        --radius: 14px;
        --radius-lg: 18px;
        --radius-xl: 24px;
        --radius-full: 9999px;
        --transition: 0.22s cubic-bezier(0.16, 1, 0.3, 1);
        --transition-spring: 0.32s cubic-bezier(0.16, 1, 0.3, 1);
      }
      [data-theme="dark"] {
        --bg: #061A12;
        --bg2: #0A3323;
        --white: rgba(10, 51, 35, 0.94);
        --dark-text: #F7F4D5;
        --secondary-text: #B4C794;
        --border: rgba(131, 153, 88, 0.22);
        --border-light: rgba(131, 153, 88, 0.12);
        --hover-bg: rgba(131, 153, 88, 0.18);
        --card-bg: rgba(10, 51, 35, 0.85);
        --shadow-sm: 0 8px 18px -14px rgba(0,0,0,0.9);
        --shadow: 0 16px 34px -26px rgba(0,0,0,0.92);
        --shadow-md: 0 20px 40px -28px rgba(0,0,0,0.96);
        --shadow-lg: 0 26px 52px -30px rgba(0,0,0,1);
        --surface: rgba(10, 51, 35, 0.88);
        --surface-strong: rgba(6, 30, 21, 0.95);
        --surface-subtle: rgba(255,255,255,0.05);
        --field-bg: rgba(247, 244, 213, 0.06);
        --field-placeholder: rgba(247, 244, 213, 0.45);
        --panel-shadow: 0 24px 60px -40px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.08);
        --shell-bg:
          radial-gradient(circle at top left, rgba(16, 86, 102, 0.35), transparent 30%),
          radial-gradient(circle at bottom right, rgba(131, 153, 88, 0.2), transparent 35%),
          #061A12;
        --page-glow:
          linear-gradient(180deg, rgba(255,255,255,0.02) 0%, transparent 18%),
          radial-gradient(circle at 50% 0%, rgba(211, 150, 140, 0.12), transparent 36%);
        --auth-bg:
          radial-gradient(circle at top, rgba(16, 86, 102, 0.4), transparent 30%),
          #061A12;
        --story-overlay: rgba(6, 26, 18, 0.96);
        --item-bg: rgba(255,255,255,0.02);
        --feed-heading: #F7F4D5;
        --feed-text: #B4C794;
      }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #839958; border-radius: 99px; }
      ::-webkit-scrollbar-thumb:hover { background: #105666; }
      [data-theme="dark"] ::-webkit-scrollbar-thumb { background: #105666; }
    </style>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('theme');
          var root = document.documentElement;
          var meta = document.querySelector('meta[name="theme-color"]');

          if (theme === 'dark') {
            root.setAttribute('data-theme', 'dark');
            if (meta) meta.setAttribute('content', '#000000');
          } else {
            root.removeAttribute('data-theme');
            if (meta) meta.setAttribute('content', '#F7F2E8');
          }
        } catch (error) {
          // Ignore localStorage access issues and keep the default theme.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
